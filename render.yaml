# Matches Render dashboard export for "Grazybot" (free web).
# Root Directory: leave EMPTY in dashboard.
# Branch: main (has main.py at repo root).
version: "1"
services:
  - type: web
    name: Grazybot
    runtime: python
    repo: https://github.com/noclearance/Grazybot
    branch: main
    plan: free
    region: ohio
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG_GUILD_ID
        sync: false
      - key: WOM_CLAN_ID
        sync: false
      - key: WOM_VERIFICATION_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SOTW_CHANNEL_ID
        sync: false
      - key: BINGO_CHANNEL_ID
        sync: false
      - key: RAFFLE_CHANNEL_ID
        sync: false
      - key: RECAP_CHANNEL_ID
        sync: false
      - key: ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      - key: GENERAL_CHAT_CHANNEL_ID
        sync: false
      - key: PVM_EVENT_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BASE44_HUB_URL
        sync: false
      - key: BASE44_HUB_TOKEN
        sync: false
      - key: HUB_API_TOKEN
        sync: false
